<!DOCTYPE html>
<html lang="lo">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>System Project By JaiNtl</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Noto Sans Lao Font -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Lao:wght@300;400;500;600;700&display=swap">
    <style>
        :root {
            --ios-bg: #030408;
            --ios-card-bg: rgba(255, 255, 255, 0.05);
            --ios-card-border: rgba(255, 255, 255, 0.15);
            --ios-card-glow: rgba(10, 132, 255, 0.12);
            --ios-input-bg: rgba(255, 255, 255, 0.07);
            --ios-accent: #0a84ff;
            --ios-accent-gradient: linear-gradient(135deg, rgba(10, 132, 255, 0.8) 0%, rgba(94, 92, 230, 0.8) 100%);
            --ios-success: #30d158;
            --ios-danger: #ff453a;
            --ios-warning: #ffd60a;
            --ios-text: #ffffff;
            --ios-text-secondary: rgba(235, 235, 245, 0.65);
            --ios-radius-lg: 24px;
            --ios-radius-md: 16px;
            --ios-radius-sm: 12px;
            --ios-transition: all 0.4s cubic-bezier(0.25, 1, 0.3, 1);
        }

        * { 
            box-sizing: border-box; 
            -webkit-font-smoothing: antialiased;
        }
        
        html, body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: var(--ios-bg);
            color: var(--ios-text);
            font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Noto Sans Lao', sans-serif;
            overflow-x: hidden;
            position: relative;
        }

        /* Background Canvas Starfield */
        #starfield {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 0;
            pointer-events: none;
        }

        .app-container {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 24px 32px;
            gap: 20px;
            position: relative;
            z-index: 1;
            max-width: 1400px;
            margin: 0 auto;
        }

        /* Glassmorphism Header Bar */
        .desktop-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(20, 20, 30, 0.35);
            backdrop-filter: blur(30px) saturate(200%);
            -webkit-backdrop-filter: blur(30px) saturate(200%);
            border: 1px solid var(--ios-card-border);
            padding: 16px 28px;
            border-radius: var(--ios-radius-lg);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            flex-wrap: wrap;
            gap: 14px;
            transition: var(--ios-transition);
        }

        .page-title {
            font-size: 21px;
            color: var(--ios-text);
            margin: 0;
            font-weight: 700;
            letter-spacing: -0.3px;
            display: flex;
            align-items: center;
            gap: 14px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* Style ຂອງ Logo ຮູບດາວສີຂາວແບບໃນຮູບແບບ Glowing Circle Star */
        .star-logo-badge {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.08);
            border: 1.5px solid rgba(255, 255, 255, 0.35);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.25), inset 0 0 10px rgba(255, 255, 255, 0.15);
            flex-shrink: 0;
            transition: var(--ios-transition);
        }
        .star-logo-badge i {
            color: #ffffff;
            font-size: 20px;
            filter: drop-shadow(0 0 8px rgba(255, 255, 255, 0.9));
        }
        .star-logo-badge:hover {
            transform: scale(1.08) rotate(15deg);
            border-color: rgba(255, 255, 255, 0.6);
            box-shadow: 0 0 28px rgba(255, 255, 255, 0.45);
        }

        .header-actions {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .btn-header {
            background: var(--ios-input-bg);
            color: var(--ios-text);
            border: 1px solid var(--ios-card-border);
            padding: 10px 18px;
            border-radius: var(--ios-radius-md);
            cursor: pointer;
            font-size: 13px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: var(--ios-transition);
            backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }
        .btn-header:hover {
            transform: translateY(-3px) scale(1.02);
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3), 0 0 15px var(--ios-card-glow);
        }
        .btn-header:active { transform: translateY(0) scale(0.98); }

        .btn-header.summary-btn {
            background: var(--ios-accent-gradient);
            border: 1px solid rgba(255, 255, 255, 0.3);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.35);
        }
        .btn-header.summary-btn:hover {
            box-shadow: 0 10px 30px rgba(10, 132, 255, 0.5);
        }

        /* Grid Layout */
        .desktop-grid {
            display: grid;
            grid-template-columns: 380px 1fr;
            gap: 24px;
            flex: 1;
        }

        @media (max-width: 960px) {
            .desktop-grid { grid-template-columns: 1fr; }
            .app-container { padding: 16px; }
        }

        /* Ultra-Glass Form Panel */
        .form-panel {
            background: rgba(20, 20, 30, 0.3);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid var(--ios-card-border);
            padding: 26px;
            border-radius: var(--ios-radius-lg);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            gap: 20px;
            transition: var(--ios-transition);
        }
        .form-panel:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .form-panel h3 { 
            margin-top: 0; 
            margin-bottom: 22px; 
            font-size: 18px; 
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 10px;
            letter-spacing: -0.2px;
        }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
        .form-group { margin-bottom: 18px; }
        label { 
            display: block; 
            font-size: 13px; 
            color: var(--ios-text-secondary); 
            margin-bottom: 8px; 
            font-weight: 500;
        }
        input, select {
            width: 100%;
            padding: 13px 16px;
            background: var(--ios-input-bg);
            border: 1px solid var(--ios-card-border);
            border-radius: var(--ios-radius-sm);
            color: var(--ios-text);
            font-size: 14px;
            font-family: inherit;
            transition: var(--ios-transition);
            outline: none;
            backdrop-filter: blur(10px);
        }
        input:focus, select:focus { 
            border-color: var(--ios-accent);
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 20px rgba(10, 132, 255, 0.3);
        }
        input[type="date"]::-webkit-calendar-picker-indicator,
        input[type="month"]::-webkit-calendar-picker-indicator { filter: invert(0.9); cursor: pointer; }
        input:disabled { opacity: 0.35; cursor: not-allowed; }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--ios-accent-gradient);
            color: #ffffff;
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: var(--ios-radius-md);
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--ios-transition);
            box-shadow: 0 6px 20px rgba(10, 132, 255, 0.3);
        }
        .btn-submit:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 10px 30px rgba(10, 132, 255, 0.5);
        }

        .btn-cancel {
            width: 100%;
            padding: 10px;
            background: rgba(255, 255, 255, 0.08);
            color: var(--ios-text);
            border: 1px solid var(--ios-card-border);
            border-radius: var(--ios-radius-sm);
            font-size: 13px;
            cursor: pointer;
            margin-top: 10px;
            display: none;
            transition: var(--ios-transition);
        }
        .btn-cancel:hover { background: rgba(255, 255, 255, 0.18); }

        .btn-clear {
            width: 100%;
            padding: 12px;
            background: rgba(255, 69, 58, 0.1);
            color: var(--ios-danger);
            border: 1px solid rgba(255, 69, 58, 0.25);
            border-radius: var(--ios-radius-sm);
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: var(--ios-transition);
        }
        .btn-clear:hover { 
            background: rgba(255, 69, 58, 0.2); 
            box-shadow: 0 4px 15px rgba(255, 69, 58, 0.2);
        }

        /* Glass Display Panel Table */
        .display-panel {
            background: rgba(20, 20, 30, 0.3);
            backdrop-filter: blur(35px) saturate(200%);
            -webkit-backdrop-filter: blur(35px) saturate(200%);
            border: 1px solid var(--ios-card-border);
            border-radius: var(--ios-radius-lg);
            box-shadow: 0 15px 45px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            transition: var(--ios-transition);
        }
        .display-panel:hover {
            border-color: rgba(255, 255, 255, 0.25);
        }

        .filter-bar {
            padding: 16px 22px;
            border-bottom: 1px solid var(--ios-card-border);
            display: flex;
            gap: 12px;
            align-items: center;
            background: rgba(0, 0, 0, 0.15);
            flex-wrap: wrap;
        }
        .filter-bar input, .filter-bar select {
            padding: 9px 14px;
            font-size: 13px;
            width: auto;
            flex: 1;
            min-width: 140px;
        }

        .table-scroll-area {
            flex: 1;
            overflow-y: auto;
            max-height: 600px;
        }

        .desktop-data-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
        }
        .desktop-data-table th {
            position: sticky;
            top: 0;
            background: rgba(15, 15, 25, 0.85);
            backdrop-filter: blur(15px);
            color: var(--ios-text-secondary);
            font-weight: 600;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 16px 20px;
            text-align: left;
            border-bottom: 1px solid var(--ios-card-border);
            z-index: 10;
        }
        .desktop-data-table td {
            padding: 15px 20px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 14px;
            transition: var(--ios-transition);
        }
        .desktop-data-table tr {
            transition: var(--ios-transition);
        }
        .desktop-data-table tr:hover td { 
            background: rgba(255, 255, 255, 0.06); 
        }
        
        .date-header-row td {
            background: rgba(10, 132, 255, 0.12);
            color: var(--ios-accent);
            font-weight: 700;
            padding: 12px 20px;
            letter-spacing: 0.2px;
        }

        .amount-add { color: var(--ios-success); font-weight: 600; text-shadow: 0 0 10px rgba(48, 209, 88, 0.3); }
        .amount-cut { color: var(--ios-danger); font-weight: 600; text-shadow: 0 0 10px rgba(255, 69, 58, 0.3); }
        .amount-absent { color: #ff3b30; font-weight: 700; text-shadow: 0 0 10px rgba(255, 59, 48, 0.4); }
        .amount-leave { color: var(--ios-warning); font-weight: 600; }
        .amount-zero { color: var(--ios-text-secondary); }

        .action-btns { display: flex; gap: 8px; }
        .btn-edit-row, .btn-delete-row {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: 1px solid transparent;
            transition: var(--ios-transition);
        }
        .btn-edit-row { background: rgba(10, 132, 255, 0.15); color: var(--ios-accent); border-color: rgba(10, 132, 255, 0.3); }
        .btn-edit-row:hover { background: var(--ios-accent); color: #fff; transform: translateY(-2px); }
        .btn-delete-row { background: rgba(255, 69, 58, 0.15); color: var(--ios-danger); border-color: rgba(255, 69, 58, 0.3); }
        .btn-delete-row:hover { background: var(--ios-danger); color: #fff; transform: translateY(-2px); }

        /* Modal Ultra Smooth Blur */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: var(--ios-transition);
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-content {
            background: rgba(25, 25, 35, 0.75);
            border: 1px solid var(--ios-card-border);
            width: 90%; max-width: 520px;
            padding: 28px;
            border-radius: var(--ios-radius-lg);
            max-height: 85vh;
            overflow-y: auto;
            box-shadow: 0 25px 60px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255, 255, 255, 0.2);
            transform: scale(0.9) translateY(20px);
            transition: var(--ios-transition);
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0);
        }
        .modal-content-large { max-width: 950px; }

        .modal-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px; border-bottom: 1px solid var(--ios-card-border); padding-bottom: 14px;
        }
        .modal-header h3 { margin: 0; font-size: 19px; }
        .btn-close-modal {
            background: rgba(255, 255, 255, 0.1); border: 1px solid var(--ios-card-border); color: var(--ios-text-secondary);
            width: 32px; height: 32px; border-radius: 50%; cursor: pointer; transition: var(--ios-transition);
            display: flex; align-items: center; justify-content: center;
        }
        .btn-close-modal:hover { background: rgba(255, 69, 58, 0.2); color: var(--ios-danger); transform: rotate(90deg); }

        .add-emp-box { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-add-emp {
            background: var(--ios-accent-gradient); color: #fff; border: 1px solid rgba(255, 255, 255, 0.2);
            padding: 0 20px; border-radius: var(--ios-radius-sm); font-weight: 600; cursor: pointer;
            transition: var(--ios-transition);
        }
        .btn-add-emp:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(10, 132, 255, 0.4); }

        .emp-manage-list {
            list-style: none; padding: 0; margin: 0; max-height: 220px;
            overflow-y: auto; border: 1px solid var(--ios-card-border); border-radius: var(--ios-radius-sm);
            background: rgba(0, 0, 0, 0.2);
        }
        .emp-manage-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 16px; border-bottom: 1px solid rgba(255, 255, 255, 0.05); font-size: 14px;
        }
        .btn-del-emp {
            background: rgba(255, 69, 58, 0.15); color: var(--ios-danger); border: none;
            padding: 4px 10px; border-radius: 12px; cursor: pointer; font-size: 12px;
            transition: var(--ios-transition);
        }
        .btn-del-emp:hover { background: var(--ios-danger); color: #fff; }

        /* Summary Table */
        .summary-controls { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
        .btn-print {
            background: var(--ios-success); color: #000; border: none;
            padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;
            transition: var(--ios-transition);
        }
        .btn-print:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(48, 209, 88, 0.4); }

        .btn-export-excel {
            background: #107c41; color: #fff; border: none;
            padding: 8px 18px; border-radius: 20px; font-weight: 600; cursor: pointer; font-size: 13px;
            transition: var(--ios-transition);
        }
        .btn-export-excel:hover { transform: translateY(-2px); box-shadow: 0 4px 15px rgba(16, 124, 65, 0.4); }

        .summary-table { width: 100%; border-collapse: collapse; margin-top: 18px; }
        .summary-table th, .summary-table td {
            border: 1px solid var(--ios-card-border); padding: 12px; text-align: center; font-size: 13px;
        }
        .summary-table th { background: rgba(255, 255, 255, 0.08); color: var(--ios-accent); font-weight: 600; }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background: rgba(25, 25, 35, 0.85);
            backdrop-filter: blur(25px);
            border: 1px solid var(--ios-card-border);
            padding: 14px 24px;
            border-radius: var(--ios-radius-md);
            box-shadow: 0 15px 35px rgba(0,0,0,0.6);
            display: flex;
            align-items: center;
            gap: 12px;
            z-index: 2000;
            transform: translateY(80px) scale(0.9);
            opacity: 0;
            transition: var(--ios-transition);
            pointer-events: none;
        }
        .toast.show { transform: translateY(0) scale(1); opacity: 1; pointer-events: auto; }

        .footer-developer { padding-top: 12px; text-align: center; }
        .social-links { display: flex; justify-content: center; gap: 14px; }
        .social-btn {
            padding: 8px 18px; border-radius: 20px; text-decoration: none;
            font-size: 12px; font-weight: 600; display: inline-flex; align-items: center; gap: 8px;
            transition: var(--ios-transition);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .btn-facebook { background: rgba(24, 119, 242, 0.15); color: #1877f2; }
        .btn-facebook:hover { background: rgba(24, 119, 242, 0.3); transform: translateY(-2px); }
        .btn-whatsapp { background: rgba(37, 211, 102, 0.15); color: #25d366; }
        .btn-whatsapp:hover { background: rgba(37, 211, 102, 0.3); transform: translateY(-2px); }

        .print-only { display: none; }

        @media print {
            body { background: #fff !important; color: #000 !important; }
